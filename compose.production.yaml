services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - colisfirst_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  colisfirst_storage:
