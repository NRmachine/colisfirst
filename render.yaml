# Proposed paid deployment: do not apply until the hosting budget is approved.
services:
  - type: web
    name: colisfirst
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: off
    disk:
      name: colisfirst-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: ColisFirst
      - key: APP_URL
        fromService:
          type: web
          name: colisfirst
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: TRUSTED_PROXIES
        value: "*"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: ColisFirst
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_LIVE
        value: "false"
      - key: LEGAL_OPERATOR
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_HOST
        value: Render
      - key: LEGAL_HOST_ADDRESS
        sync: false
